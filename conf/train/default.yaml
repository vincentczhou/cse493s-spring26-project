# Default training config for train/train_tokenizer.py.
# Override specific fields by creating sibling group configs (e.g. conf/train/t_zero.yaml)
# and selecting them via `uv run train/train_tokenizer.py train=t_zero`.

# Transition point. Special cases:
#   t == vocab_size      -> only Phase 1 runs (standard BPE w/ whitespace pretok)
#   t == 0               -> only Phase 2 runs (BPE w/o whitespace pretok)
#   0 < t < vocab_size   -> SuperBPE (Phase 1 to t, Phase 2 extends to vocab_size)
t: 16000
vocab_size: 16000  # final vocab size T (PLAN.md §4)

# Training corpus.
input_file: ${data.output_dir}/${data.train_file}
train_chars: 1e8  # Unicode codepoints (prefix of input_file)

output_dir: _tokenizers
output_file: t${train.t}_n1e8.json

overwrite: false
