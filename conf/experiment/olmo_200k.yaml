# @package _global_

defaults:
  - default
  - /data: olmo
  - _self_

# OLMo 2 pretraining mix, vocab size 200k — parallel structure to c4_16k for
# direct comparison. Vocab scaled 12.5x, t values scaled proportionally to keep
# the same t/vocab ratios (0, 0.25, 0.5, 0.75, 1.0).
experiment:
  name: olmo_200k
  vocab_size: 200000
  sweep_grid:
    t: [0, 50000, 100000, 150000, 200000]
    train_chars: [1000, 10000, 100000, 1000000, 10000000, 100000000]
