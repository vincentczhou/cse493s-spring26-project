# @package _global_

experiment:
  tokenizers_dir: _tokenizers/${experiment.name}
  streams_dir: _test_streams/${experiment.name}
  results_file: results/${experiment.name}.jsonl

sweep:
  # Phase 1: train tokenizers in parallel. Each subprocess is CPU-heavy via rayon,
  # so train_workers × rayon_num_threads should ≤ total CPU cores to avoid contention.
  # Defaults assume a 16-core machine.
  train_workers: 4
  rayon_num_threads: 4
  # Phase 2: tokenize test slice + compute metrics in parallel. These steps are
  # single-threaded so we can run more in parallel without over-subscription.
  eval_workers: 8
  # Whether to regenerate results_file
  overwrite: false

# Tokenizer params used by train/train_tokenizer.py and eval/tokenize_test.py.
# These are defaults for manual single-cell runs; the sweep overrides
# t / train_chars / output_file per cell.
tokenizer:
  vocab_size: ${experiment.vocab_size}
  # Transition point. Special cases:
  #   t == vocab_size      -> only Phase 1 runs (standard BPE w/ whitespace pretok)
  #   t == 0               -> only Phase 2 runs (BPE w/o whitespace pretok)
  #   0 < t < vocab_size   -> SuperBPE (Phase 1 to t, Phase 2 extends to vocab_size)
  t: ${tokenizer.vocab_size}
  input_file: ${data.output_dir}/${data.train_file}
  train_chars: 1e8
  output_dir: ${experiment.tokenizers_dir}
  output_file: t${tokenizer.t}_n1e8.json
  # Whether to regenerate output_file
  overwrite: false

# Eval (tokenize_test) params — output dir is namespaced by experiment so
# cached token streams don't collide between experiments.
eval:
  output_dir: ${experiment.streams_dir}
  # Whether to regenerate token stream (set to tokenizer name with a different extension)
  overwrite: false