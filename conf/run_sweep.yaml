sweep:
  # Grid (cross product). Each pair (t, n) maps to a config conf/tokenizer/t_<t>_n1e<n>.yaml.
  t_values: [0, 4000, 8000, 12000, 16000]
  n_exponents: [3, 4, 5, 6, 7, 8]

  results_file: results/results.jsonl
  overwrite: false  # if true, delete results.jsonl before starting

  # Phase 1: train tokenizers in parallel. Each subprocess is CPU-heavy via rayon,
  # so train_workers × rayon_num_threads should ≤ total CPU cores to avoid contention.
  # Defaults assume a 16-core machine.
  train_workers: 4
  rayon_num_threads: 4

  # Phase 2: tokenize test slice + compute metrics in parallel. These steps are
  # single-threaded so we can run more in parallel without over-subscription.
  eval_workers: 16

hydra:
  run:
    dir: outputs/run_sweep/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}